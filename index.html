<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ivosia</title>
</head>
<body>

<script>
const ios = "https://apps.apple.com/us/app/ivosia-rider-driver/id6791614570";
const android = "https://play.google.com/store/apps/details?id=com.ivosia.app";

const ua = navigator.userAgent;

const isIOS =
    /iPad|iPhone|iPod/.test(ua) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

const isAndroid = /Android/i.test(ua);

if (isIOS) {
    window.location.replace(ios);
} else if (isAndroid) {
    window.location.replace(android);
} else {
    window.location.replace(android);
}
</script>

</body>
</html>
